<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photographs — AOISEIKOU</title>

    <link rel="stylesheet" href="css/photographs.css">
    <script src="js/photographs.js" defer></script>
</head>

<body>

    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar">

        <a href="home.html" class="brand">

            <span class="brand-mark">
                AOI
            </span>

            <span class="brand-name">
                AOISEIKOU
            </span>

        </a>


        <div class="top-center">

            <span class="status">
                <i></i>
                ONLINE
            </span>

            <span>
                PHOTOGRAPHS
            </span>

        </div>


        <div class="top-right">

            <span id="clock">
                00:00:00
            </span>

            <a href="#" id="random-photo">
                RANDOM
            </a>

            <a href="media.html">
                MEDIA
            </a>

        </div>

    </header>


    <!-- =====================================================
         PHOTO FIELD

         THIS IS INTENTIONALLY FREE-FORM.

         Each photo can have its own:
         --x
         --y
         --size
         --rotation

         Example:

         style="
             --x: 12%;
             --y: 18%;
             --size: 420px;
             --rotation: -3deg;
         "

         Add more photo objects wherever you want.
    ====================================================== -->

    <main class="photograph-field">


        <!-- FIELD HEADER -->

        <section class="field-heading">

            <div class="photo-kicker">
                AOISEIKOU / MEDIA / 05
            </div>

            <h1>
                PHOTOGRAPHS
            </h1>

            <p>
                A collection without a fixed arrangement.
                Images are placed individually, as they are kept.
            </p>

        </section>


        <!-- =================================================
             PHOTO 001
        ================================================== -->

        <figure
            class="photo-object"
            style="
                --x: 8%;
                --y: 35%;
                --size: 500px;
                --rotation: -3deg;
            "
            data-photo="1"
        >

            <button
                class="photo-open"
                type="button"
                aria-label="Open Photograph 001"
            >

                <img
                    src="pictures/blog-006-4.png"
                    alt="Toyota FT-01 Concept"
                    loading="lazy"
                >

            </button>


            <figcaption>

                <span>
                    Blog-006-4.png
                </span>

                <span>
                    Toyota FT-01 Concept.
                </span>

            </figcaption>

        </figure>

        <!-- =================================================
             ADD MORE PHOTOS HERE

             COPY A WHOLE PHOTO OBJECT.

             Change:

             1. data-photo
             2. image filename
             3. alt text
             4. caption
             5. --x
             6. --y
             7. --size
             8. --rotation

             Example:

             <figure
                 class="photo-object"
                 style="
                     --x: 42%;
                     --y: 88%;
                     --size: 360px;
                     --rotation: -2deg;
                 "
                 data-photo="5"
             >

                 ...

             </figure>
        ================================================== -->


        <!-- FIELD MARKER -->

        <div class="field-marker">
            END OF CURRENT STORAGE
        </div>

    </main>


    <!-- =====================================================
         IMAGE VIEWER
    ====================================================== -->

    <div
        class="viewer"
        id="viewer"
        aria-hidden="true"
    >

        <button
            class="viewer-close"
            id="viewer-close"
            type="button"
            aria-label="Close image"
        >
            CLOSE ×
        </button>


        <div class="viewer-content">

            <img
                id="viewer-image"
                src=""
                alt=""
            >

            <div
                class="viewer-caption"
                id="viewer-caption"
            >
            </div>

        </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <span>
            AOISEIKOU / PHOTOGRAPHS
        </span>

        <a href="media.html">
            RETURN TO MEDIA
        </a>

    </footer>

</body>
</html>
